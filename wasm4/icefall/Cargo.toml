[package]
edition = "2021"
name = "cart"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib"]

[dependencies]
buddy-alloc = {version = "0.4.1", optional = true}
oorandom = "11.1.3"
w4utils = {path = "./w4utils"}

[build-dependencies]
png2wasm4src = "0.1.0"

[profile.release]
lto = true            # link-time optimization across all crates
opt-level = "z"       # optimize aggressively for size
strip = true          # drop symbols (the cart imports its own memory; debug info isn't needed)
codegen-units = 1     # better optimization at the cost of slower compiles
panic = "abort"       # no unwinding machinery -> smaller binary

[features]
# use `--no-default-features` or comment out next line to disable allocator
default = ["buddy-alloc"]
